# ============================================================
# 大模型监测管理平台 — Docker Compose 生产部署（主编排）
#
# 用法：
#   1. 复制 .env.example 为 .env 并修改密码/密钥
#   2. docker compose up -d
#   3. 访问 http://<服务器IP>:80 （前端管理台）
#
# 说明：
#   - 平台自身服务：postgres / redis / rabbitmq / api-server /
#     celery-worker / web(nginx+前端静态资源)
#   - Higress AI 网关单独编排，见 docker-compose.higress.yml
# ============================================================
name: llm-ops

services:
  # ---------- 数据层 ----------
  postgres:
    image: postgres:16-alpine
    container_name: llm-ops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-llmops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-ai_platform}
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 分区表等高级 DDL 由 init 脚本创建（可选，见 sql/01-create-tables.sql）
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-llmops} -d ${POSTGRES_DB:-ai_platform}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [backend]

  redis:
    image: redis:7-alpine
    container_name: llm-ops-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-change_me}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change_me}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [backend]

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: llm-ops-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-llmops}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change_me}
    ports:
      - "15672:15672"   # 管理台（按需开放）
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 12
    networks: [backend]

  # ---------- 应用层 ----------
  api-server:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: llm-ops-api
    restart: unless-stopped
    command: >
      sh -c "python -m app.core.init_db &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${API_WORKERS:-2}"
    environment: &api_env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-llmops}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-ai_platform}
      REDIS_URL: redis://:${REDIS_PASSWORD:-change_me}@redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-llmops}:${RABBITMQ_PASSWORD:-change_me}@rabbitmq:5672/
      SECRET_KEY: ${SECRET_KEY:-please_change_me_to_random}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      AUTO_CREATE_TABLES: "true"
      HIGRESS_ADMIN_API: http://higress-gateway:8080/api
      TZ: Asia/Shanghai
    ports:
      - "8000:8000"   # 按需开放（调试用），生产走 nginx/higress
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 10s
      retries: 12
    networks: [backend, frontend]

  celery-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: llm-ops-celery
    restart: unless-stopped
    command: celery -A app.tasks.worker:celery_app worker -l info --concurrency=${CELERY_CONCURRENCY:-4}
    environment: *api_env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      api-server: { condition: service_started }
    networks: [backend]

  celery-beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: llm-ops-celery-beat
    restart: unless-stopped
    command: celery -A app.tasks.worker:celery_app beat -l info
    environment: *api_env
    depends_on:
      rabbitmq: { condition: service_healthy }
    networks: [backend]

  # ---------- 前端 ----------
  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: llm-ops-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api-server
    networks: [frontend]

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
