server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # OpenAI 兼容模型入口（带平台 Key 调用），转发到 api-server
    # 注意：前缀 location 按「最长前缀」匹配，与书写顺序无关，
    #       /v1/xxx 会命中本块而不是 SPA fallback 的 location /（顺序仅对正则 location 有意义）
    #
    # 这里同时是 SSE 流式入口，下面 5 组参数缺一不可（默认值都会出问题）：
    #   proxy_buffering off      默认 on，会把流式 token 攒进 buffer 再吐，
    #                            客户端表现为"一顿一顿蹦"甚至首字超时
    #   proxy_read_timeout       默认 60s，模型长回答超过 60s 无字节即被掐成 504；
    #                            取 600s，需 > 后端 HTTP_READ_TIMEOUT(默认 300s)
    #   proxy_http_version 1.1   默认 1.0，无法与上游 keep-alive，每请求重连
    #   Connection ""            清掉客户端 Connection 头，配合 1.1 复用长连接
    #   client_max_body_size     默认 1m，长上下文对话体（历史 messages）会 413
    location /v1/ {
        proxy_pass http://api-server:8000;

        # 流式透传（SSE）必需
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 长回答 / 长上下文
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 10s;
        client_max_body_size 20m;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API proxy to backend
    location /api/ {
        proxy_pass http://api-server:8000;
        # 必须保留原始 Host（含端口），否则后端 301/307 重定向时丢失 :8085，
        # 浏览器会跳到无端口地址（80/ongrid）导致 CORS 失败
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}